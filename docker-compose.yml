services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongodb_visualizer
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_PASS}
    depends_on:
      - mongodb

  service-user:
    build: .
    container_name: service_user
    environment:
      - MONGO_URL=mongodb://mongodb:27017/hubertapp_users
    depends_on:
      - mongodb
    ports:
      - "3001:3001"

volumes:
  mongo_data:


