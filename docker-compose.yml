# Nom de service unique : Compose ajoute toujours le nom de service comme alias
# DNS, et MS-Admin declare aussi un service « mongodb » sur hubert-network. Avec
# un alias partage, Docker resout en round-robin : ce service (sans auth) et
# celui de MS-Admin (avec auth) se repondaient mutuellement une fois sur deux.
services:
  mongodb-user:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27003:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hubert-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongodb_visualizer
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb-user
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_PASS}
    depends_on:
      - mongodb-user
    networks:
      - hubert-network

  service-user:
    build: .
    container_name: service_user
    labels:
      logging: "promtail"
      service: "service-user"
    environment:
      - MONGO_URL=mongodb://mongodb-user:27017/hubertapp_users
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=service-user
      - OTEL_RESOURCE_ATTRIBUTES=service.name=service-user,deployment.environment=development
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    depends_on:
      - mongodb-user
    ports:
      - "3001:3001"
    networks:
      - hubert-network

volumes:
  mongo_data:


networks:
  hubert-network:
    external: true
