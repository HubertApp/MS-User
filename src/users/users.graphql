type User {
    id: Int
    username: String
    age: Int
    email: String
    handicape : Boolean
}

input CreateUserInput {
    id: Int
    username: String
    age: Int
    email: String
    handicape : Boolean
}

input UpdateUserInput {
  id: Int!
}

type Query {
  users: [User]!
  user(id: Int!): User
}

type Mutation {
  createUser(createUserInput: CreateUserInput!): User!
  updateUser(updateUserInput: UpdateUserInput!): User!
  removeUser(id: Int!): User
}
